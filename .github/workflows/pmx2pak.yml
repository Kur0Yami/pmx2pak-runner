name: pmx2pak

# MH Rise (Sunbreak) armor: PMX -> .mesh/.mdf2/.tex -> natives zip + .pak
# Jalan di windows-latest karena konversi .tex (texconv) hanya ada versi Windows.

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: "URL zip PMX (kosong = pakai input/model.zip di repo ini)"
        default: ""
      natives_url:
        description: "URL mod natives (kosong = pakai input/natives.7z di repo ini)"
        default: ""
      set_name:
        description: "Nama set (dipakai buat nama file output)"
        default: "hiyuki_new"
      parts:
        description: "Bagian yang diganti (mod hiyuki: cukup wst)"
        default: "wst"
      scale:
        description: "Skala PMX -> meter (MMD standar ~0.08)"
        default: "0.08"
      hide_materials:
        description: "Nama material PMX yang dibuang, pisah koma (opsional)"
        default: ""
      dump_only:
        description: "true = cuma dump daftar bone ref (buat isi bonemap.json), tidak export"
        type: boolean
        default: false
      blender_version:
        description: "Versi Blender (zip portable)"
        default: "4.2.3"
      mesh_editor_ref:
        description: "Branch/tag RE-Mesh-Editor"
        default: "main"
      pak_patch_no:
        description: "Nomor patch pak (re_chunk_000.pak.patch_XXX.pak)"
        default: "099"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Download input dari URL
        run: |
          mkdir -p work/model work/nat out
          MU="${{ inputs.model_url }}"; NU="${{ inputs.natives_url }}"
          # kalau tidak ada URL dan file belum di-import ke repo -> pakai URL publik bawaan (selama repo sumber masih publik)
          if [ -z "$MU" ] && [ ! -f input/model.zip ]; then
            MU="https://github.com/Kur0Yami/mhgu-appearance-runner/raw/main/models/hiyuki.zip"; echo "input/model.zip belum ada -> fallback URL publik"
          fi
          if [ -z "$NU" ] && [ ! -f input/natives.7z ]; then
            NU="https://github.com/Kur0Yami/MODS/raw/main/input/hiyuki.zip"; echo "input/natives.7z belum ada -> fallback URL publik"
          fi
          if [ -n "$MU" ]; then curl -fL --retry 3 -o work/model.bin "$MU"; else cp input/model.zip work/model.bin; fi
          if [ -n "$NU" ]; then curl -fL --retry 3 -o work/nat.bin "$NU"; else cp input/natives.7z work/nat.bin; fi
          7z x work/model.bin -owork/model -y > /dev/null
          7z x work/nat.bin -owork/nat -y > /dev/null
          cp -r work/nat/* ref/
          echo "PMX:"; find work/model -iname "*.pmx"
          echo "ref:"; find ref -type f | head -40
          test -f ref/parts.json || { echo "::error::ref/parts.json belum ada"; exit 1; }

      - name: Install Blender (portable)
        run: |
          V="${{ inputs.blender_version }}"
          MAJ="${V%.*}"
          curl -fsSL -o blender.zip "https://download.blender.org/release/Blender${MAJ}/blender-${V}-windows-x64.zip"
          7z x blender.zip -oblender -y > /dev/null
          BL=$(find blender -maxdepth 2 -name blender.exe | head -1)
          echo "BLENDER=$(pwd)/$BL" >> $GITHUB_ENV
          echo "BLVER=$MAJ" >> $GITHUB_ENV

      - name: Install addon (mmd_tools + RE-Mesh-Editor)
        run: |
          # Blender 4.2 tidak membaca <install>/scripts/addons -> pakai user scripts dir via env
          SCR="$(pwd -W)/bscripts"; EXT="$(pwd -W)/bext"
          mkdir -p "$SCR/addons" "$EXT"
          echo "BLENDER_USER_SCRIPTS=$SCR" >> $GITHUB_ENV
          echo "BLENDER_USER_EXTENSIONS=$EXT" >> $GITHUB_ENV
          export BLENDER_USER_SCRIPTS="$SCR" BLENDER_USER_EXTENSIONS="$EXT"
          # mmd_tools butuh modul 'opencc' (tidak ada di python bawaan Blender)
          PY="$(dirname "$BLENDER")/$BLVER/python/bin/python.exe"
          "$PY" -m ensurepip --upgrade || true
          "$PY" -m pip install --quiet --target "$SCR/modules" opencc-python-reimplemented
          git clone --depth 1 https://github.com/UuuNyaa/blender_mmd_tools.git work/mmd
          git clone --depth 1 --branch "${{ inputs.mesh_editor_ref }}" https://github.com/NSACloud/RE-Mesh-Editor.git work/remesh
          rm -rf work/mmd/.git work/remesh/.git
          # mmd_tools: legacy kalau ada bl_info, kalau tidak -> extension
          if grep -q "bl_info" work/mmd/mmd_tools/__init__.py; then
            cp -r work/mmd/mmd_tools "$SCR/addons/mmd_tools"; echo "mmd_tools: legacy"
          else
            (cd work/mmd/mmd_tools && 7z a ../../mmd_tools.zip . > /dev/null)
            "$BLENDER" --command extension install-file -r user_default work/mmd_tools.zip
            echo "mmd_tools: extension"
          fi
          # RE-Mesh-Editor: cari folder addon (punya bl_info)
          INIT=$(grep -rl "bl_info" work/remesh --include=__init__.py | head -1)
          echo "RE addon src: $(dirname "$INIT")"
          cp -r "$(dirname "$INIT")" "$SCR/addons/re_mesh_editor"
          echo "RE_ADDON=re_mesh_editor" >> $GITHUB_ENV
          find "$SCR/addons" -maxdepth 2 -name "__init__.py"

      - name: Konversi PMX -> RE mesh
        run: |
          "$BLENDER" -b --factory-startup -P scripts/convert.py -- \
            --pmx-dir work/model \
            --ref-dir ref \
            --bonemap scripts/bonemap.json \
            --out out \
            --parts "${{ inputs.parts }}" \
            --scale "${{ inputs.scale }}" \
            --hide "${{ inputs.hide_materials }}" \
            --re-addon "$RE_ADDON" \
            --dump-only "${{ inputs.dump_only }}" 2>&1 | tee out/convert.log

      - name: Ambil crash log Blender (kalau ada)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p out
          cp "$TEMP/blender.crash.txt" out/blender.crash.txt 2>/dev/null || cp /c/Users/RUNNER~1/AppData/Local/Temp/blender.crash.txt out/ 2>/dev/null || echo "tidak ada crash log"

      - name: Susun natives + zip (Fluffy Mod Manager)
        if: ${{ !inputs.dump_only }}
        run: |
          test -d out/natives || { echo "::error::out/natives kosong, cek convert.log"; exit 1; }
          [ -d ref/reframework ] && cp -r ref/reframework out/ || true
          cd out && 7z a "../${{ inputs.set_name }}_natives.zip" natives $( [ -d reframework ] && echo reframework ) > /dev/null

      - name: Build REE.Packer & bikin .pak
        if: ${{ !inputs.dump_only }}
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/Ekey/REE.PAK.Tool.git work/pakTool
          PROJ=$(find work/pakTool -iname "REE.Packer*.csproj" | head -1)
          echo "Packer project: $PROJ"
          dotnet build "$PROJ" -c Release -o work/packer
          PACKER=$(find work/packer -iname "REE.Packer.exe" | head -1)
          PAK="re_chunk_000.pak.patch_${{ inputs.pak_patch_no }}.pak"
          mkdir -p pakroot && cp -r out/natives pakroot/
          "$PACKER" "pakroot" "$PAK"
          ls -la "$PAK"
          mkdir -p dist && mv "$PAK" dist/

      - name: Upload hasil
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.set_name }}
          path: |
            dist/*.pak
            ${{ inputs.set_name }}_natives.zip
            out/convert.log
            out/blender.crash.txt
            out/ref_bones_*.txt
          if-no-files-found: warn
